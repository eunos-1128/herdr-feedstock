context:
  version: "0.8.0"

package:
  name: herdr
  version: ${{ version }}

source:
  url: https://github.com/ogulcancelik/herdr/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 47bdb0753beb8a6b157cf2fec26fbe6b787f85ffea0dde579b0001d6cd663572
  patches:
    # Fix libghostty-vt shared DLL missing ucrt/vcruntime link on Windows (cf. GhosttyLib.zig)
    # TODO: Submit PR to upstream
    - ${{ 'libghostty-vt-windows-msvc-crt.patch' if win }}

build:
  number: 0
  script:
    interpreter: brush
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: win
        then:
          # workaround for zig 0.15.2 bug: convertPathArg panics on cross-drive paths (Build/Step/Run.zig)
          - sed -i "s|assert(!std\.fs\.path\.isAbsolute(child_cwd_rel));|if (std.fs.path.isAbsolute(child_cwd_rel)) return child_cwd_rel;|" "${BUILD_PREFIX}/Library/lib/zig/std/Build/Step/Run.zig"
      - cargo auditable install --path=. --root="${PREFIX}" --no-track --locked --bins --target-dir=target
      - cargo-bundle-licenses --format=yaml --output=./THIRDPARTY.yml
      - |
        mkdir -p \
          "${PREFIX}/share/bash-completion/completions" \
          "${PREFIX}/share/zsh/site-functions" \
          "${PREFIX}/share/fish/vendor_completions.d" \
          "${PREFIX}/share/elvish/lib" \
          "${PREFIX}/share/herdr/completions"
      - herdr completion bash > "${PREFIX}/share/bash-completion/completions/herdr"
      - herdr completion zsh > "${PREFIX}/share/zsh/site-functions/_herdr"
      - herdr completion fish > "${PREFIX}/share/fish/vendor_completions.d/herdr.fish"
      - herdr completion elvish > "${PREFIX}/share/elvish/lib/herdr.elv"
      - herdr completion powershell > "${PREFIX}/share/herdr/completions/herdr.ps1"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - ${{ 'm2-sed' if win }}
    - brush
    - cargo-auditable
    - cargo-bundle-licenses
    - 'zig >=0.15.2,<0.16'  # upstream issue: https://github.com/ogulcancelik/herdr/issues/285

tests:
  - package_contents:
      bin:
        - herdr
      files:
        - share/bash-completion/completions/herdr
        - share/zsh/site-functions/_herdr
        - share/fish/vendor_completions.d/herdr.fish
        - share/elvish/lib/herdr.elv
        - share/herdr/completions/herdr.ps1
      strict: true
  - script:
      interpreter: brush
      content:
        - herdr --version
        - herdr --help
        - herdr --skill > /dev/null
    requirements:
      run:
       - brush

about:
  homepage: https://herdr.dev
  documentation: https://herdr.dev/docs
  repository: https://github.com/ogulcancelik/herdr
  summary: Agent multiplexer that lives in your terminal
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    # cannot obtain license by `cargo-bundle-licenses` because of zig libraries
    - vendor/libghostty-vt/LICENSE
    # License files for dependencies selected by `emit-lib-vt`.
    # Herdr enables SIMD:
    # https://github.com/ogulcancelik/herdr/blob/e16d7d8c07a20f5ee0b4111808680bbcfd7df9ac/build.rs#L49-L69
    # lib-vt adds uucode and, with SIMD enabled, simdutf and highway:
    # https://github.com/ghostty-org/ghostty/blob/c5a21edfcbc2d5b46540ad91b7980aca31f5f1f3/src/build/GhosttyZig.zig#L105-L143
    # https://github.com/ghostty-org/ghostty/blob/c5a21edfcbc2d5b46540ad91b7980aca31f5f1f3/src/build/SharedDeps.zig#L756-L798
    # Other `.zon` entries, such as vaxis/zigimg, are not linked into lib-vt.
    # uucode's selected wcwidth extension is informed by the implementations in
    # resources/wcwidth, so their redistribution notices are included too:
    # https://github.com/jacobsandlund/uucode/blob/e987cb5d83643bde0945b74d30f530899c64843e/src/x/config_x/wcwidth.zig#L29-L30
    - licenses/libghostty-vt_THIRDPARTY/

  description: |
    Run all your coding agents from one terminal, on any box, even over ssh.
    Each runs in its own real terminal, on a server that keeps it alive when you close the laptop.
    See blocked, working, and done at a glance, and reattach from your phone.

extra:
  recipe-maintainers:
    - eunos-1128
